# Antumbra local stack
# To run:
#   cp docker/.env.example docker/.env   # then fill in the secrets + data path
#   docker compose -f docker/docker-compose.yml up -d

name: antumbra

services:
  surrealdb:
    # 3.2 for DISKANN, which 3.0.5 does not parse -- driftnet's chunk index
    # needs it, and antumbra's own client is already on the 3.2.4 SDK. Pinned
    # rather than :latest, which on Docker Hub still resolves to 2.4.0.
    image: surrealdb/surrealdb:v3.2.4
    container_name: antumbra-surrealdb
    user: "65532:65532"
    command:
      - start
      - --user
      - root
      - --bind
      - 0.0.0.0:8000
      - rocksdb:/data/antumbra.db
    # The root password rides the environment (surreal reads SURREAL_PASS), never
    # the command line, so a process listing or `docker inspect .Args` does not
    # print it.
    environment:
      - SURREAL_PASS=${SURREAL_PASS:?set SURREAL_PASS in docker/.env}
    volumes:
      - ${ANTUMBRA_SURREAL_DATA:?set ANTUMBRA_SURREAL_DATA in docker/.env}:/data
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 8s

  antumbra-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: antumbra-mcp:local
    container_name: antumbra-mcp
    depends_on:
      surrealdb:
        condition: service_healthy
    command:
      - --http
      - 0.0.0.0:8081
      - --url
      - ws://surrealdb:8000/rpc
      - --db-user
      - root
      - --embedder-url
      - ${ANTUMBRA_EMBEDDER_URL:-http://host.docker.internal:11434/v1/embeddings}
      - --embedder-model
      - ${ANTUMBRA_EMBEDDER_MODEL:-all-minilm}
    # Secrets ride the environment, never the command line. Members of the
    # docker group can still read a container's environment through `docker
    # inspect`; a deployment that mounts secrets as files (Docker secrets,
    # Kubernetes, a Key Vault CSI mount) passes --db-pass-file and
    # --jwt-secret-file instead and keeps them out of both.
    environment:
      - ANTUMBRA_JWT_SECRET=${ANTUMBRA_JWT_SECRET:?set ANTUMBRA_JWT_SECRET in docker/.env}
      - ANTUMBRA_DB_PASS=${SURREAL_PASS}
      # The node name in its users' fabrics (ADR-0017). Without it the
      # container ID is the name, and every recreate registers this machine
      # as a brand new node while the old rows go on claiming to be trainers.
      - ANTUMBRA_HOST=${ANTUMBRA_HOST:-${HOSTNAME}}
      # The cross-encoder precision stage. Unset = off, and recall returns the
      # RRF order as before. With the `rerank` profile started, the service is
      # reachable on the compose network by name:
      #   ANTUMBRA_RERANK_URL=http://rerank/rerank
      - ANTUMBRA_RERANK_URL=${ANTUMBRA_RERANK_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback by default: the surface is JWT-authenticated, but a default of
      # "reachable from the network" is not one to inherit by accident. A node
      # whose agents run on OTHER machines sets ANTUMBRA_MCP_BIND to the address
      # it should answer on (e.g. 10.0.0.132) in docker/.env, which is the file a
      # redeploy preserves -- so the exposure survives a rebuild instead of being
      # silently reverted to loopback by the next deploy, taking every remote
      # hook down with it.
      - "${ANTUMBRA_MCP_BIND:-127.0.0.1}:8081:8081"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  # Hosted control plane: invite-gated signup + magic-link login that mints the
  # RS256 tokens the MCP server verifies. Optional -- omit it for the offline /
  # HS256 (mint-token) flow. Run alongside the rest:
  #   docker compose -f docker/docker-compose.yml up -d antumbra-control-server
  # To make the MCP server accept its tokens, start it with
  # --jwt-public-key /keys/control-signing.pub.pem --jwt-audience antumbra.
  antumbra-control-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control
    image: antumbra-control-server:local
    container_name: antumbra-control-server
    depends_on:
      surrealdb:
        condition: service_healthy
    command:
      - serve
      - --url
      - ws://surrealdb:8000/rpc
      # Least privilege: point these at a `DEFINE USER ... ON DATABASE` user
      # and set ANTUMBRA_CONTROL_DB_AUTH=database (one-time DDL in
      # docker/README.md). The defaults fall back to instance root for a quick
      # local bring-up.
      - --db-user
      - ${ANTUMBRA_CONTROL_DB_USER:-root}
      - --db-auth
      - ${ANTUMBRA_CONTROL_DB_AUTH:-root}
      - --addr
      - 0.0.0.0:8090
      - --base-url
      - ${ANTUMBRA_CONTROL_BASE_URL:-http://127.0.0.1:8090}
      - --signing-key
      - /keys/control-signing.pem
    environment:
      - ANTUMBRA_MAGIC_SECRET=${ANTUMBRA_MAGIC_SECRET:?set ANTUMBRA_MAGIC_SECRET in docker/.env}
      - ANTUMBRA_DB_PASS=${ANTUMBRA_CONTROL_DB_PASS:-${SURREAL_PASS}}
      # Set SMTP_HOST/PORT/USER/PASS/FROM to deliver real magic-link email; left
      # empty, links are logged to this container's stderr (dev mailer).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      # The RS256 private key (issuer), mounted read-only -- never baked into the
      # image. Generate the pair into docker/keys/ (gitignored):
      #   openssl genrsa -out docker/keys/control-signing.pem 2048
      #   openssl rsa -in docker/keys/control-signing.pem -pubout \
      #     -out docker/keys/control-signing.pub.pem
      - ./keys:/keys:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:8090"
    # Distroless has no shell or curl, so the binary probes itself: one
    # HTTP/1.0 GET against /healthz, which round-trips the store.
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/antumbra-control-server",
          "probe",
          "--addr",
          "127.0.0.1:8090",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  # The cross-encoder that re-scores hybrid recall's fused pool (the precision
  # stage). It reads each (query, memory) PAIR rather than comparing two
  # independently-built vectors, which is why it is immune to the length bias
  # that makes a short stub outrank a long answer: measured on that exact pair,
  # the answer scored 0.9904 and the stub 0.0000375.
  #
  # OPT-IN, because the model is a few hundred megabytes and recall works
  # without it -- antumbra-mcp falls back to the fused RRF order and says so on
  # stderr. Start it with:
  #   docker compose -f docker/docker-compose.yml --profile rerank up -d rerank
  # then point ANTUMBRA_RERANK_URL at http://rerank/rerank in docker/.env.
  #
  # `restart: unless-stopped` is what makes it survive a host reboot once
  # started; a profile only governs which services a compose COMMAND acts on,
  # not whether an already-running container comes back.
  rerank:
    # The cpu-1.5 tag fails with "Could not download model artifacts / relative
    # URL without a base" and setting HF_ENDPOINT does not help. cpu-latest
    # resolves an ONNX build and works; it needs ~2 minutes to become ready.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: antumbra-rerank
    profiles: ["rerank"]
    command:
      - --model-id
      - ${ANTUMBRA_RERANK_MODEL:-BAAI/bge-reranker-base}
    environment:
      # Cache the weights in the named volume so a recreate does not re-download.
      - HUGGINGFACE_HUB_CACHE=/data
    volumes:
      - antumbra-rerank-cache:/data
    ports:
      # Loopback only, and only for probing it by hand -- antumbra-mcp reaches it
      # by service name on the compose network. NOT 8090: antumbra-control-server
      # already binds that.
      - "127.0.0.1:8091:80"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  antumbra-rerank-cache:
