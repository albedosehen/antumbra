# GPU override: swap the light antumbra-mcp for the `models,cuda` build, which
# adds real expert serving (the `answer` tool) and autonomous consolidation
# (`--auto-consolidate`: a reinforced memory auto-graduates its compartment into
# a private expert on the GPU). Use alongside the base compose:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.gpu.yml up -d
#
# Needs an NVIDIA GPU + the NVIDIA Container Toolkit on the host (Linux, or
# Windows via WSL2). NOT yet CI-validated; see docs/running-the-trainer.md.
# The light docker/docker-compose.yml remains the default for non-GPU hosts.

services:
  antumbra-mcp:
    build:
      dockerfile: docker/Dockerfile.cuda
    image: antumbra-mcp-gpu:local
    # Command is replaced wholesale (compose does not merge arrays). Unlike the light
    # base server this OMITS --embedder-url, so the IN-PROCESS candle BERT embedder
    # (all-MiniLM-L6-v2, compiled via --features models, running on the GPU) is used --
    # one embedder for embed + train + serve, with no Ollama dependency and no
    # cross-runtime embedding drift. Plus --auto-consolidate (a reinforced memory's
    # compartment auto-graduates into a private expert on the GPU).
    command:
      - --http
      - 0.0.0.0:8081
      - --url
      - ws://surrealdb:8000/rpc
      - --db-user
      - root
      - --db-pass
      - ${SURREAL_PASS}
      - --auto-consolidate
    # Serving caches base weights and consolidation writes adapter files, so the
    # light server's read-only root is relaxed and two volumes are added.
    read_only: false
    volumes:
      - ${ANTUMBRA_WEIGHTS:-antumbra-weights}:/weights
      - ${ANTUMBRA_ADAPTERS:-antumbra-adapters}:/adapters
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  antumbra-weights:
  antumbra-adapters:
