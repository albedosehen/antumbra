# GPU override: swap the light antumbra-mcp for the `models,cuda` build, which
# adds real expert serving (the `answer` tool) and the keeper that trains each
# user's standing experts from the behaviours they accepted. Use alongside the
# base compose:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.gpu.yml up -d
#
# Needs an NVIDIA GPU + the NVIDIA Container Toolkit on the host (Linux, or
# Windows via WSL2). NOT yet CI-validated; see docs/running-the-trainer.md.
# The light docker/docker-compose.yml remains the default for non-GPU hosts.

services:
  antumbra-mcp:
    build:
      dockerfile: docker/Dockerfile.cuda
    image: antumbra-mcp-gpu:local
    # Command is replaced wholesale (compose does not merge arrays); the password
    # still rides ANTUMBRA_DB_PASS from the base service's environment. Unlike the light
    # base server this OMITS --embedder-url, so the IN-PROCESS candle BERT embedder
    # (all-MiniLM-L6-v2, compiled via --features models, running on the GPU) is used --
    # one embedder for embed + train + serve, with no Ollama dependency and no
    # cross-runtime embedding drift.
    command:
      - --http
      - 0.0.0.0:8081
      - --url
      - ws://surrealdb:8000/rpc
      - --db-user
      - root
    # Serving caches base weights and the keeper writes adapter files, so the
    # light server's read-only root is relaxed and two volumes are added.
    read_only: false
    volumes:
      - ${ANTUMBRA_WEIGHTS:-antumbra-weights}:/weights
      - ${ANTUMBRA_ADAPTERS:-antumbra-adapters}:/adapters
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # The cross-encoder on the same GPU, when the `rerank` profile runs. On a CPU,
  # bge-reranker-base scores a batch of 32 memories in 3.5 to 5 seconds, so the
  # 100-candidate pool of a twelve-row recall took 13 seconds and the hooks that
  # recall on every session and every prompt ran out of time. The GPU sits idle
  # between the model server's requests; on an RTX 3090 Ti it scores the same 32
  # in 65 to 80 ms for about 900 MiB of memory, and its fp16 scores keep the
  # CPU's order to within 1-4% of each score, well inside what the calibrated
  # relevance floor can tell apart. TEI builds one image per compute
  # capability: `86-` is Ampere consumer and workstation cards (RTX 30x0, A10,
  # A40); set ANTUMBRA_RERANK_GPU_IMAGE in docker/.env for another (`89-` for
  # Ada, the bare version for A100). The model, cache volume, port and health
  # check come from the base service.
  rerank:
    image: ${ANTUMBRA_RERANK_GPU_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:86-1.9}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  antumbra-weights:
  antumbra-adapters:
