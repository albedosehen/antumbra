# cargo-audit configuration.
#
# The gate stays on. What lives here is the small set of advisories that cannot
# be cleared by a version bump, each with the reason it is carried and what
# would let it be dropped. An advisory with a fix available does not belong in
# this file -- bump the dependency instead.

[advisories]
ignore = [
  # rkyv 0.7.46 -- insufficient archive validation, out-of-bounds reads in
  # archives containing Rc/Arc. Fixed in 0.8.17, a major version away.
  #
  # This workspace never compiles rkyv. It reaches the lockfile through
  # rust_decimal's OPTIONAL `rkyv` feature, which nothing enables:
  # `cargo tree -i rkyv --workspace --target all -e all` prints nothing, and
  # rkyv appears zero times in the full 5350-line dependency tree. cargo-audit
  # scans Cargo.lock rather than the build graph, so it reports crates that are
  # merely reachable in principle. Drop this entry if anything ever turns the
  # feature on -- at which point the advisory becomes real and rust_decimal
  # needs to move to rkyv 0.8.
  "RUSTSEC-2026-0235",

  # rsa 0.9.10 -- Marvin attack, a timing sidechannel in RSA private-key
  # operations. No fixed version exists; the advisory has been open since 2023.
  #
  # Unavoidable: it arrives through jsonwebtoken 10.4, which surrealdb-core
  # 3.2.4 depends on as well as antumbra-auth/-control/-mcp, so dropping our own
  # use would not remove it.
  #
  # The reachable operations are RS256 signing and verification. Verification
  # uses the public key and has no secret to leak. Signing uses the private key,
  # but the attacker does not choose its input -- the JWT payload is
  # server-generated -- and the Marvin vector is chosen-ciphertext DECRYPTION,
  # which this path never performs. Low exploitability rather than none, which
  # is why it is written down instead of waved through. Re-check whenever `rsa`
  # ships a fix.
  "RUSTSEC-2023-0071",

  # quick-xml 0.39.4 -- quadratic time checking a start tag for duplicate
  # attributes (-0194), and unbounded allocation for namespace declarations
  # in `NsReader` (-0195). Both fixed in 0.41.
  #
  # Not clearable by a bump: quick-xml arrives through object_store 0.13.2,
  # which surrealdb-core 3.3.0 pins (`^0.13.2`) with its aws, gcp and azure
  # features on, and object_store moves to quick-xml 0.41 only in 0.14.1.
  #
  # Unreachable as Antumbra runs SurrealDB. object_store parses XML only in
  # its cloud backends, reading the replies of S3, GCS and Azure. surrealdb
  # reaches those only through a `SURREAL_OBJECT_STORE` url naming a cloud
  # store, or a bucket defined on one. Antumbra sets neither, and defines no
  # buckets; its embedded stores are local and its remote store is another
  # process. The XML a cloud backend parses would also come from that cloud
  # provider, not from a client. Drop these when surrealdb-core moves to
  # object_store 0.14.1 or later.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",

  # crypto-bigint 0.5.5 -- timing variability in operations meant to be
  # constant-time. Fixed only in 0.7.6.
  #
  # Not clearable by a bump: it arrives through surrealdb-core 3.3.0's
  # jsonwebtoken 10.4 -> p256 0.13 -> elliptic-curve 0.13, which cannot take
  # crypto-bigint 0.7. Antumbra's own jsonwebtoken is 11 on aws-lc-rs and
  # signs and verifies HS256 and RS256 only.
  #
  # Unreachable: the leak needs secret P-256 scalar operations to time, and
  # nothing here performs one. SurrealDB would use p256 only for an access
  # method configured with an ES algorithm; Antumbra's one access method
  # (`tenant`, record access) configures no JWT algorithm, so SurrealDB signs
  # its session tokens with HMAC. Drop this when surrealdb or jsonwebtoken
  # moves to elliptic-curve 0.14.
  "RUSTSEC-2026-0387",

  # surrealdb-core 3.3.0 -- data race and double free through reblessive
  # 0.4.3, whose stack and runner types claim `Send` and `Sync`
  # unconditionally (-0454). Fixed in surrealdb 4.0, which drops reblessive.
  #
  # Not clearable by a bump: every 3.x release, 3.3.5 included, keeps
  # reblessive 0.4.3. Antumbra's move to SurrealDB 4 is held for a 4.0.0
  # planner bug that breaks vector recall under a member's session
  # (surrealdb/surrealdb#7668).
  #
  # Not reached the way surrealdb-core 3.3.0 drives reblessive. The advisory
  # needs one of two uses: polling two copies of a driver future from
  # `Runner::step_async`/`finish_async` on different threads, or moving a
  # stack to another thread while the thread that made it keeps an alias of
  # its `!Send` state. Outside its tests surrealdb-core calls neither of
  # those methods; it builds only `TreeStack`s and drives each with
  # `stack.enter(..).finish().await`, where `finish` consumes the runner, so
  # no driver future is copied and a stack moves only with the one future
  # that owns it. Antumbra never calls reblessive itself, and where it runs
  # against a SurrealDB server over ws://, as the compose deployment does, no
  # statement runs through this build's executor at all. Drop this when
  # Antumbra moves to SurrealDB 4.
  "RUSTSEC-2026-0454",

  # surrealkv 0.21.4 -- out-of-bounds read when an internal key shorter than
  # 16 bytes is decoded, reachable from a crafted or corrupted SSTable on disk
  # (-0452). Fixed in 1.2.0.
  #
  # Not clearable by a bump: surrealdb-kvs-surrealkv 3.3.x requires surrealkv
  # ^0.21.4; 1.2 ships only with SurrealDB 4, which is held as above.
  #
  # Reachable only from the store's own files. surrealkv reads SSTables from
  # an embedded store's directory (`--url surrealkv://...`, the default for
  # the CLI and for a one-machine MCP server), which only the Antumbra process
  # writes; whoever can plant a crafted table there can already rewrite the
  # store. What remains is a table corrupted on disk, which a release build
  # reads eight bytes out of bounds instead of refusing. The compose
  # deployment runs SurrealDB as its own server (rocksdb, over ws://), where
  # this build's surrealkv opens nothing. Drop this when Antumbra moves to
  # SurrealDB 4.
  "RUSTSEC-2026-0452",
]
