name: mcp-image

# Publishes the antumbra-mcp image on main pushes. ONEIRIQ_READ_TOKEN
# feeds the Dockerfile's BuildKit secret for the private oneiriq-kayak
# workspace dependency; it never lands in a layer.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          secrets: |
            oneiriq_token=${{ secrets.ONEIRIQ_READ_TOKEN }}
          tags: |
            ghcr.io/albedosehen/antumbra-mcp:${{ github.sha }}
            ghcr.io/albedosehen/antumbra-mcp:latest
