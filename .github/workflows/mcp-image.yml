name: mcp-image

# Publishes the antumbra-mcp image on main pushes. The main workspace has no
# private dependencies, so the build needs no secret.
#
# Three tags: the commit, `latest`, and main-<YYYYMMDDHHmmss>-<short sha>. The
# last sorts by when it was built, which is what a Flux ImagePolicy needs to
# pick the newest build of main on its own; the commit tag stays for pins
# written by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tags
        id: tags
        run: |
          short=$(git rev-parse --short=7 HEAD)
          stamp=$(date -u +%Y%m%d%H%M%S)
          echo "main=ghcr.io/albedosehen/antumbra-mcp:main-${stamp}-${short}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/albedosehen/antumbra-mcp:${{ github.sha }}
            ghcr.io/albedosehen/antumbra-mcp:latest
            ${{ steps.tags.outputs.main }}
