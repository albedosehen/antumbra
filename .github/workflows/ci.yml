name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    env:
      # This job links roughly thirty test binaries, each statically embedding
      # the whole SurrealDB stack. At the default `debug = 2` the DWARF dwarfs
      # the code and target/ outgrows the runner's disk, at which point lld --
      # which writes its output through an mmap -- dies with SIGBUS rather than
      # anything that says "no space left". That was this job's failure for a
      # month: `collect2: fatal error: ld terminated with signal 7 [Bus error]`.
      #
      # Line tables keep file and line in panic backtraces, which is what a
      # test failure actually needs, at a fraction of full debug info. Set here
      # rather than in Cargo.toml so a local `cargo build` keeps its variables.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      # The image ships toolchains this workspace never uses, and they are the
      # difference between fitting on disk and not.
      - name: reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h /
      # Pinned to match rust-toolchain.toml so fmt/clippy are deterministic and
      # never drift from local. Bump both together when moving to a newer Rust.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      # The oneiriq-kayak dependency lives in a private repo, reached over ssh
      # locally. CI has no ssh key, so rewrite both spellings of the Oneiriq
      # remote to https with a read token, and make cargo fetch through the
      # git CLI (also set in .cargo/config.toml; exported here so the fetch
      # survives that file moving). ONEIRIQ_READ_TOKEN is a repo secret: a
      # fine-grained token with read access to Oneiriq/kayak.
      - name: authorize the private kayak fetch
        run: |
          git config --global url."https://x-access-token:${{ secrets.ONEIRIQ_READ_TOKEN }}@github.com/Oneiriq/".insteadOf "ssh://git@github.com/Oneiriq/"
          git config --global --add url."https://x-access-token:${{ secrets.ONEIRIQ_READ_TOKEN }}@github.com/Oneiriq/".insteadOf "https://github.com/Oneiriq/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # Runs even when the build died, so a recurrence says whether disk was
      # the reason instead of leaving the next reader to infer it from SIGBUS.
      - name: disk after build
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  models-build:
    name: candle model build + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      # Same private-fetch rewrite as the check job: resolving the workspace
      # reads every member's manifest, so even a -p build of crates that never
      # touch kayak needs the fetch to succeed.
      - name: authorize the private kayak fetch
        run: |
          git config --global url."https://x-access-token:${{ secrets.ONEIRIQ_READ_TOKEN }}@github.com/Oneiriq/".insteadOf "ssh://git@github.com/Oneiriq/"
          git config --global --add url."https://x-access-token:${{ secrets.ONEIRIQ_READ_TOKEN }}@github.com/Oneiriq/".insteadOf "https://github.com/Oneiriq/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      # Compile AND lint the candle Qwen2.5-Coder + LoRA stack and everything
      # gated on `models` (serving, the MCP consolidation trigger, the CLI train
      # command). No run — training/inference needs a GPU — but `-D warnings`
      # keeps the model path from drifting, since the default-feature clippy above
      # never sees it.
      - name: clippy --features models
        run: cargo clippy -p antumbra-train -p antumbra-serve -p antumbra-mcp -p antumbra-cli --features models --all-targets -- -D warnings

  hooks:
    name: agent hook scripts
    runs-on: ubuntu-latest  # jq + curl preinstalled — exercises the POSIX .sh path
    steps:
      - uses: actions/checkout@v4
      - name: syntax check (bash -n)
        run: for f in scripts/hooks/*.sh; do bash -n "$f"; done
      - name: capture hook emits a block decision, then fires once
        run: |
          out=$(printf '%s' '{"session_id":"ci","hook_event_name":"Stop"}' | bash scripts/hooks/antumbra-capture.sh)
          echo "$out" | jq -e '.decision == "block"' > /dev/null
          # The same turn fires once: a second call clears the sentinel and is silent.
          printf '%s' '{"session_id":"ci2","hook_event_name":"Stop"}' | bash scripts/hooks/antumbra-capture.sh > /dev/null
          again=$(printf '%s' '{"session_id":"ci2","hook_event_name":"Stop"}' | bash scripts/hooks/antumbra-capture.sh)
          test -z "$again"
      - name: strip-attribution denies vendor attribution, allows a clean command
        run: |
          deny=$(printf '%s' '{"tool_input":{"command":"git commit -m x --trailer Co-Authored-By:Claude"}}' | bash scripts/hooks/strip-attribution.sh)
          echo "$deny" | jq -e '.hookSpecificOutput.permissionDecision == "deny"' > /dev/null
          clean=$(printf '%s' '{"tool_input":{"command":"git commit -m clean"}}' | bash scripts/hooks/strip-attribution.sh)
          test -z "$clean"
      - name: session-start emits valid additionalContext (no server → cold bootstrap)
        run: |
          ctx=$(printf '%s' '{}' | ANTUMBRA_URL=http://127.0.0.1:1 bash scripts/hooks/antumbra-session-start.sh)
          echo "$ctx" | jq -e '.hookSpecificOutput.hookEventName == "SessionStart"' > /dev/null

  audit:
    name: cargo audit (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      # cargo audit reads the committed Cargo.lock without fetching, but it is
      # still a cargo job, and the rewrite keeps it working the day it grows a
      # flag that resolves for real.
      - name: authorize the private kayak fetch
        run: |
          git config --global url."https://x-access-token:${{ secrets.ONEIRIQ_READ_TOKEN }}@github.com/Oneiriq/".insteadOf "ssh://git@github.com/Oneiriq/"
          git config --global --add url."https://x-access-token:${{ secrets.ONEIRIQ_READ_TOKEN }}@github.com/Oneiriq/".insteadOf "https://github.com/Oneiriq/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@cargo-audit
      # Scans the committed Cargo.lock against the RustSec advisory DB. Fails on a
      # known vulnerability; triage an unfixable transitive one with `--ignore
      # RUSTSEC-XXXX` (or move it into an audit.toml) rather than dropping the gate.
      - name: cargo audit
        run: cargo audit
