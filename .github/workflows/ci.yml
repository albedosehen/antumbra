name: ci

# SCRATCH, not for merge. This branch exists to time two NEON kernels on the
# Apple-silicon runner, which no other machine at hand can run. It replaces
# the whole workflow with the one job, so the pull request that carries it
# runs nothing else, and it is closed once the figures are read.

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  pace:
    name: scratch, time the NEON rows (not for merge)
    runs-on: macos-latest  # Apple silicon, NEON with the dot product
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: what the runner is
        run: |
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.ncpu hw.memsize hw.l1dcachesize hw.l2cachesize
      - name: the tests of the two kernels, optimized
        run: |
          cargo test -p antumbra-train --features models --release --lib -- tiles sketch
      - name: pace, first run
        run: |
          cargo test -p antumbra-train --features models --release --lib pace_ -- --ignored --nocapture --test-threads=1
      - name: pace, second run
        run: |
          cargo test -p antumbra-train --features models --release --lib pace_ -- --ignored --nocapture --test-threads=1
