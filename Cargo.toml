[workspace]
resolver = "2"
members = [
    "crates/antumbra-core",
    "crates/antumbra-auth",
    "crates/antumbra-store",
    "crates/antumbra-embed",
    "crates/antumbra-copal",
    "crates/antumbra-github",
    "crates/antumbra-ingest",
    "crates/antumbra-bench",
    "crates/antumbra-rerank",
    "crates/antumbra-critic",
    "crates/antumbra-eclipse",
    "crates/antumbra-gate",
    "crates/antumbra-boundary",
    "crates/antumbra-loop",
    "crates/antumbra-train",
    "crates/antumbra-serve",
    "crates/antumbra-cli",
    "crates/antumbra-tui",
    "crates/antumbra-mcp",
    "crates/antumbra-sync",
    "crates/antumbra-control",
]
# The hosted control plane is its own cargo workspace, not a member here: its
# optional `contract` feature pulls a private git dependency (oneiriq-kayak),
# and cargo reads every member's manifest on any build, so keeping it in would
# make the whole workspace unbuildable without access to that repo. Build it
# from its own directory: `cd crates/antumbra-control-server && cargo build`.
exclude = ["crates/antumbra-control-server"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.90"
repository = "https://github.com/Oneiriq/antumbra"
authors = ["Shon Thomas <shon@oneiriq.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
tachyonfx = "0.25"
oneiriq-surql = { version = "0.33", default-features = false, features = ["client-rustls"] }

[profile.dev]
opt-level = 0

# Workaround: rustc 1.96 segfaults (STATUS_ACCESS_VIOLATION)
[profile.release.package.surrealdb-core]
opt-level = 1

[profile.release.package.surrealdb]
opt-level = 1

[profile.dist]
inherits = "release"
lto = "thin"
