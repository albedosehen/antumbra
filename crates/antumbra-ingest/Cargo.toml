[package]
name = "antumbra-ingest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Knowledge-document ingest, the one path every door into the store takes: the original to copal first (fail closed), chunks replaced in place per title, the git anchor folded into every chunk. Shared by the MCP tool, the CLI, and the GitHub integration."

[dependencies]
antumbra-core = { path = "../antumbra-core" }
antumbra-store = { path = "../antumbra-store" }
antumbra-copal = { path = "../antumbra-copal" }
anyhow.workspace = true
chrono.workspace = true

[dev-dependencies]
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
tokio = { workspace = true, features = ["rt", "macros"] }
serde_json.workspace = true
