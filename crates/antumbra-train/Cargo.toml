[package]
name = "antumbra-train"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ADR-0002: the DIY candle QLoRA trainer (shadow adapters + the gate). Seam only — the real candle path is not yet built."

[dependencies]
antumbra-core = { path = "../antumbra-core" }
async-trait.workspace = true
# candle is the training engine (ADR-0010). CPU backend by default so the
# workspace stays buildable everywhere; `cuda`/`metal` light up the GPU.
candle-core = "0.10"
candle-nn = "0.10"
serde_json.workspace = true
thiserror.workspace = true
# The real model stack (MT-1), behind the `models` feature so the default
# workspace build stays light. candle 0.10 -> cudarc 0.19 (CUDA 13 via
# cuda-version-from-build-system) + hf-hub 0.5.
serde = { workspace = true, optional = true }
tokenizers = { version = "0.22", optional = true }
hf-hub = { version = "0.5", optional = true }
# Not model-gated: the decode policy (repetition penalty / nucleus sampling) is
# pure logits math, unit-tested in the default build. rand is tiny.
rand = "0.8"
# candle 0.10 pins cudarc 0.19, whose nvcc probe only knows CUDA <= 13.2 and
# panics on a newer toolkit (e.g. 13.3). `fallback-latest` makes it use its
# newest supported version (13.2, ABI-compatible with 13.3 libs) when the bare
# `nvcc` probe can't resolve a known version. Declared only to add that feature
# to the cudarc candle already pulls under `cuda`.
cudarc = { version = "0.19", default-features = false, optional = true }

[features]
default = []
# A GPU backend is only meaningful with the candle model path, so it implies
# `models` (a `--features cuda` build gives the real model code, not a bare stub).
cuda = ["models", "candle-core/cuda", "candle-nn/cuda", "dep:cudarc", "cudarc/fallback-latest"]
metal = ["models", "candle-core/metal", "candle-nn/metal"]
# The candle Qwen2.5-Coder + LoRA CausalLm: model load, generation, training.
models = ["dep:serde", "dep:tokenizers", "dep:hf-hub"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
chrono.workspace = true
