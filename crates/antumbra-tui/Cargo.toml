[package]
name = "antumbra-tui"
version = "0.2.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Antumbra operator console (`antumbra tui`): a live, animated TUI over the population (umbra), boundaries (antumbra), and the learned gate, read from the Antumbra server. ratatui + tachyonfx."

# A library `antumbra tui` runs; it ships inside the `antumbra` command.
[package.metadata.dist]
dist = false

[dependencies]
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
antumbra-store = { path = "../antumbra-store" }
# The server's console routes are plain HTTP; a blocking request run off the
# async runtime, as the CLI and the embedder do.
ureq = { version = "3", features = ["json"] }
# Reads a token's claims (unverified) to prefer an operator's among those on hand.
base64 = "0.22"
ratatui.workspace = true
tachyonfx.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
serde_json.workspace = true
chrono.workspace = true
# Headless snapshots for the operator console: render a frame to an in-memory buffer and emit
# a text grid (e2e-assertable) or a PNG screenshot (visual fidelity). `image`
# encodes the PNG; `ab_glyph` rasterizes the embedded Cascadia Mono (OFL, see
# assets/CascadiaMono.LICENSE) so braille / box-drawing / symbols render true.
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"

[features]
# Raster image path (sixel/kitty/iTerm2) as a progressive enhancement over the
# universal Braille/Canvas tier. Empty until the graphics backend is wired with
# the first raster-worthy visual; declaring it keeps `cfg(feature = "raster")`
# from tripping the unexpected-cfg lint. The default build stays raster-free.
raster = []
