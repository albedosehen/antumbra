[package]
name = "antumbra-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Antumbra operator console: a live, animated TUI over the population (umbra), boundaries (antumbra), and the learned gate. ratatui + tachyonfx."

[package.metadata.wix]
upgrade-guid = "F71ABE7F-DB06-4E54-80F6-877B0B1713D9"
path-guid = "C6AD2A37-72A9-439C-88C4-F1E86E935DE4"
license = false
eula = false

[[bin]]
name = "antumbra-tui"
path = "src/main.rs"

[dependencies]
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
antumbra-store = { path = "../antumbra-store" }
antumbra-embed = { path = "../antumbra-embed" }
ratatui.workspace = true
tachyonfx.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
serde_json.workspace = true
chrono.workspace = true
# Headless snapshots for the operator console: render a frame to an in-memory buffer and emit
# a text grid (e2e-assertable) or a PNG screenshot (visual fidelity). `image`
# encodes the PNG; `ab_glyph` rasterizes the embedded Cascadia Mono (OFL, see
# assets/CascadiaMono.LICENSE) so braille / box-drawing / symbols render true.
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"

[features]
# Raster image path (sixel/kitty/iTerm2) as a progressive enhancement over the
# universal Braille/Canvas tier. Empty until the graphics backend is wired with
# the first raster-worthy visual; declaring it keeps `cfg(feature = "raster")`
# from tripping the unexpected-cfg lint. The default build stays raster-free.
raster = []
