[package]
name = "antumbra-serve"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ADR-0006: S-LoRA-style multi-adapter serving (llama-cpp-2 / mistral.rs) over one base. Seam only — the real engine is not yet wired."

[dependencies]
antumbra-core = { path = "../antumbra-core" }
async-trait.workspace = true
serde_json.workspace = true
# The real candle embedder (all-MiniLM-L6-v2) lives here behind the `models`
# feature so the default serve build stays light. Mirrors antumbra-train.
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
tokenizers = { version = "0.22", optional = true }
hf-hub = { version = "0.5", optional = true }
# Candle serving reuses the trainer's Qwen2.5-Coder + LoRA model (ADR-0006).
antumbra-train = { path = "../antumbra-train", optional = true }
# Await-safe mutex (cached model) + block_in_place (don't park the runtime
# worker during synchronous generation, ADR-0011 #4).
tokio = { workspace = true, features = ["sync", "rt-multi-thread"], optional = true }

[features]
default = []
# The candle BERT sentence embedder (ADR-0005) + candle adapter serving (ADR-0006).
models = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
    "dep:antumbra-train",
    "antumbra-train/models",
    "dep:tokio",
]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "antumbra-train/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal", "antumbra-train/metal"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
# The keystone search drives the real probe in tests (depends only on core).
antumbra-boundary = { path = "../antumbra-boundary" }
