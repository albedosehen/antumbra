[package]
name = "antumbra-serve"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hardware-adaptive S-LoRA-style multi-adapter serving over one resident base via candle (hot-swap LoRA factors per routed expert). Build with --features models for the real engine."

[dependencies]
antumbra-core = { path = "../antumbra-core" }
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The real candle embedder (all-MiniLM-L6-v2) lives here behind the `models`
# feature so the default serve build stays light. Mirrors antumbra-train.
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
# Pinned to 0.22 to match candle-core's transitive tokenizers (^0.22) -- a newer
# minor would just duplicate the crate in the tree until candle updates.
tokenizers = { version = "0.22", optional = true }
# The stable 1.0.0 release (this pin rode the rc.1 pre-release until it shipped).
hf-hub = { version = "1.0.0", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }
# Candle serving reuses the trainer's Qwen2.5-Coder + LoRA model (hardware-adaptive serving).
antumbra-train = { path = "../antumbra-train", optional = true }
# Autonomous consolidation (memory -> private expert) reads the store and runs
# the exec verifier; models-gated, so the default serve build stays light.
antumbra-store = { path = "../antumbra-store", optional = true }
antumbra-critic = { path = "../antumbra-critic", optional = true }
chrono = { workspace = true, optional = true }
# Await-safe mutex (cached model) + block_in_place (don't park the runtime
# worker during synchronous generation, a v1 serving-throughput concern).
tokio = { workspace = true, features = ["sync", "rt-multi-thread"], optional = true }

[features]
default = []
# The candle BERT sentence embedder (routing-as-retrieval) + candle adapter serving (hardware-adaptive).
models = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
    "dep:antumbra-train",
    "antumbra-train/models",
    "dep:antumbra-store",
    "dep:antumbra-critic",
    "dep:chrono",
    "dep:tokio",
]
# A GPU backend only matters for the candle model path, so it implies `models`
# (a `--features cuda` build gives the real engine, not the CPU stub). Matches
# antumbra-mcp's `cuda = ["models", ...]`.
cuda = ["models", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "antumbra-train/cuda"]
metal = ["models", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal", "antumbra-train/metal"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
# Counterfactual search drives the real probe in tests (depends only on core).
antumbra-boundary = { path = "../antumbra-boundary" }
