[package]
name = "antumbra-embed"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Antumbra HTTP embedder: an OpenAI-compatible /embeddings client behind the core Embedder port, shared by the MCP server and the operator console so route/recall use the same embedding the population was built with."

[dependencies]
antumbra-core = { path = "../antumbra-core" }
antumbra-store = { path = "../antumbra-store" }
serde_json.workspace = true
async-trait.workspace = true
# `spawn_blocking` offloads the blocking `ureq` POST off the async runtime.
tokio = { workspace = true }
# Outbound HTTP for the runtime-configured embeddings endpoint. Pure-Rust TLS so
# it needs no system OpenSSL; `json` for send_json/read_json.
ureq = { version = "3", features = ["json"] }
