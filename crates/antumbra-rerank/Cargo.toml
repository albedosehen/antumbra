[package]
name = "antumbra-rerank"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Antumbra HTTP reranker: a TEI/Cohere-style cross-encoder /rerank client behind the core Reranker port, applied downstream of hybrid recall to re-score candidates by (query, content) relevance."

[dependencies]
antumbra-core = { path = "../antumbra-core" }
serde_json.workspace = true
async-trait.workspace = true
# `spawn_blocking` offloads the blocking `ureq` POST off the async runtime.
tokio = { workspace = true }
# Outbound HTTP for the runtime-configured rerank endpoint. Pure-Rust TLS so it
# needs no system OpenSSL; `json` for send_json/read_json.
ureq = { version = "3", features = ["json"] }
