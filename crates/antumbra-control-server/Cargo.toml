[package]
name = "antumbra-control-server"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.95"
repository = "https://github.com/Oneiriq/antumbra"
authors = ["Shon Thomas <shon@oneiriq.com>"]
description = "Antumbra hosted control plane: an HTTP surface for invite-gated signup, magic-link login, and RS256 token issuance, run separately from the data-plane MCP server."

# Its own cargo workspace, on purpose: the root workspace excludes this crate
# because its `contract` feature is the repo's one private git dependency and
# cargo resolves every member's manifest on any build. The path dependencies
# on the sibling crates still resolve; only the lockfile is separate, and the
# `.cargo/config.toml` beside this file shares the root target directory.
[workspace]

[[bin]]
name = "antumbra-control-server"
path = "src/main.rs"

# Not a release artifact: the hosted control plane is deployed as a container,
# not installed from a shell/MSI installer. Opts out of `dist` for the same
# reason antumbra-bench does.
[package.metadata.dist]
dist = false

[dependencies]
antumbra-control = { path = "../antumbra-control" }
antumbra-store = { path = "../antumbra-store" }
antumbra-core = { path = "../antumbra-core" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
# Real SMTP delivery (sync transport over rustls), pulled in only under `smtp`.
# Without it the server uses the dev mailer that logs the link to stderr.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "rustls-tls",
    "builder",
], optional = true }
# The contract layer (lib name `kayak`), only under the `contract` feature: the
# wire contract in src/contract/ is validated against the store's real indexes
# and generates the checked-in API artifacts (docs/openapi.json,
# docs/schema.graphql). It declares the contract; nothing executes it yet.
# Private repo: local fetches ride ssh, CI rewrites the URL to https with a
# read token. Off by default so this crate builds from crates.io alone.
oneiriq-kayak = { git = "ssh://git@github.com/Oneiriq/kayak.git", branch = "main", optional = true }
# The schema vocabulary kayak resolves the contract against; the same version
# the store builds its TableDefinitions with, so the two speak one type.
oneiriq-surql = { version = "0.34.2", default-features = false, features = ["client-rustls"], optional = true }

[dev-dependencies]
# `oneshot` drives the axum router in tests without binding a socket.
tower = { version = "0.5", features = ["util"] }

[features]
default = []
# Enable real SMTP magic-link delivery (configure via SMTP_HOST/PORT/USER/PASS/FROM).
smtp = ["dep:lettre"]
# The kayak wire contract, its drift gate (tests/contract.rs), and the artifact
# generation. The one private dependency in the repo; the four routes this
# server actually serves do not need it.
contract = ["dep:oneiriq-kayak", "dep:oneiriq-surql"]
