[package]
name = "antumbra-loop"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ADR-0008: the durable generational loop. A resumable state-machine-in-DB (grow -> explore -> score -> decide -> consolidate) driven by injected ports; the persisted head is the checkpoint."

[dependencies]
antumbra-core = { path = "../antumbra-core" }
antumbra-store = { path = "../antumbra-store" }
# Promotes a verified correction's BoundaryFinding into a persistable, embedded
# actionable boundary (ADR-0004).
antumbra-boundary = { path = "../antumbra-boundary" }
chrono.workspace = true
serde_json.workspace = true
# sha256 of a frozen adapter's bytes = the no-forgetting regression fingerprint
# (ADR-0001). Already in the dependency tree, so no new compile cost.
sha2 = "0.10"

[dev-dependencies]
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
