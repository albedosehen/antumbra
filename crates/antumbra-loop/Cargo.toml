[package]
name = "antumbra-loop"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The durable generational loop: a resumable state-machine-in-DB (grow -> explore -> score -> decide -> consolidate) driven by injected ports; the persisted head is the checkpoint."

[dependencies]
antumbra-core = { path = "../antumbra-core" }
antumbra-eclipse = { path = "../antumbra-eclipse" }
# The heuristic gate, so contribution routes the live tasks as serving does.
antumbra-gate = { path = "../antumbra-gate" }
antumbra-store = { path = "../antumbra-store" }
# Promotes a verified correction's BoundaryFinding into a persistable, embedded
# actionable counterfactual boundary.
antumbra-boundary = { path = "../antumbra-boundary" }
# The trust protocol's measurement, so the loop can recheck the verifiers that
# judged its training against their anchors.
antumbra-critic = { path = "../antumbra-critic" }
chrono.workspace = true
serde_json.workspace = true
# sha256 of a frozen adapter's bytes = the no-forgetting regression fingerprint
# (the frozen-expert population). Already in the dependency tree, so no new compile cost.
sha2 = "0.11"

[dev-dependencies]
async-trait.workspace = true
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
