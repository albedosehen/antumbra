[package]
name = "antumbra-sync"
version = "0.4.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Collector/sync: bidirectional last-write-wins replication of the penumbra between a local embedded store and a remote authoritative one."

[dependencies]
antumbra-core = { path = "../antumbra-core" }
antumbra-store = { path = "../antumbra-store" }
oneiriq-surql.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true

[dev-dependencies]
# The embedded stores the sync's tests stand up on each side.
antumbra-store = { path = "../antumbra-store", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
