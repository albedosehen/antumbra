[package]
name = "antumbra-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Collector/sync: bidirectional last-write-wins replication of the penumbra between a local embedded store and a remote authoritative one."

[dependencies]
antumbra-core = { path = "../antumbra-core" }
antumbra-store = { path = "../antumbra-store" }
oneiriq-surql.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
