[package]
name = "antumbra-critic"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ADR-0003: verifier-first reward aggregation; the critic only densifies between verifier checkpoints."

[dependencies]
antumbra-core = { path = "../antumbra-core" }
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true

[dev-dependencies]
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
tokio = { workspace = true, features = ["rt", "macros"] }
