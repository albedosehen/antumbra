[package]
name = "antumbra-critic"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Verifier-first reward aggregation for credit assignment; the critic only densifies between verifier checkpoints."

[dependencies]
antumbra-core = { path = "../antumbra-core" }
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
# Async subprocess + timeout for sandboxing untrusted verify programs.
tokio = { workspace = true, features = ["process", "time"] }

[dev-dependencies]
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
tokio = { workspace = true, features = ["rt", "macros"] }
