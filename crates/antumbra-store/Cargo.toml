[package]
name = "antumbra-store"
version = "0.5.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "SurrealDB persistence for Antumbra via surql-rs: schema-as-code, migrations, repositories, and HNSW recall."

[dependencies]
# A profile's image is bytes and a row is JSON.
base64 = "0.22"
antumbra-core = { path = "../antumbra-core" }
oneiriq-surql.workspace = true
# Direct dep purely to light up the embedded in-memory engine (additive
# feature unification with surql-rs's `surrealdb/rustls`). Lets the store +
# durable loop be tested fully in-process with no external server.
surrealdb = { version = "3", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
# Polls the surql-rs LiveQuery stream for the change-feed watcher.
futures = "0.3"
# Spans around recall's retrieval legs, exported by antumbra-mcp when it
# traces (see its `telemetry::TRACE_FILTER`). No subscriber here.
tracing = "0.1"
# The credential flags the binaries share (`args`), behind the `clap` feature
# so the library stays flag-free for everyone else.
clap = { workspace = true, optional = true, features = ["env"] }

[features]
clap = ["dep:clap"]
# An embedded store, provisioned members and a signed-in session, for the
# tests of the crates that drive a store.
testing = []

[dev-dependencies]
# The crate's own integration tests build the library without cfg(test), so
# they take the `testing` module through the feature, as a dependant would.
antumbra-store = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow.workspace = true
serde_json.workspace = true
chrono.workspace = true
# End-to-end test: counterfactual search + gate over the substrate.
# These crates depend only on antumbra-core, so there is no dependency cycle.
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
antumbra-boundary = { path = "../antumbra-boundary" }
antumbra-gate = { path = "../antumbra-gate" }

[lints]
workspace = true
