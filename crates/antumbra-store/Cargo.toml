[package]
name = "antumbra-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "SurrealDB persistence for Antumbra via surql-rs: schema-as-code, migrations, repositories, and HNSW recall."

[dependencies]
antumbra-core = { path = "../antumbra-core" }
oneiriq-surql.workspace = true
# Direct dep purely to light up the embedded in-memory engine (additive
# feature unification with surql-rs's `surrealdb/rustls`). Lets the store +
# durable loop be tested fully in-process with no external server.
surrealdb = { version = "3", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
# Polls the surql-rs LiveQuery stream for the change-feed watcher (R-2).
futures = "0.3"
# Spans around recall's retrieval legs, exported by antumbra-mcp when it
# traces (see its `telemetry::TRACE_FILTER`). No subscriber here.
tracing = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json.workspace = true
chrono.workspace = true
# End-to-end test: counterfactual search + gate over the substrate.
# These crates depend only on antumbra-core, so there is no dependency cycle.
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
antumbra-boundary = { path = "../antumbra-boundary" }
antumbra-gate = { path = "../antumbra-gate" }
