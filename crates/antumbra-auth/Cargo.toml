[package]
name = "antumbra-auth"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The JWT token contract for the antumbra networked surface: the (tenant, user) identity claims, HS256/RS256 minting, and verification. Shared by the MCP server (verifier) and the control plane (issuer)."

[dependencies]
jsonwebtoken = "10"
serde = { workspace = true }
anyhow.workspace = true
uuid = { version = "1", features = ["v4"] }
