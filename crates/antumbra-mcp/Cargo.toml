[package]
name = "antumbra-mcp"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Antumbra MCP server: the Penumbra memory store (and, later, the population) exposed over the Model Context Protocol. The runtime surface that lets an agent talk to Antumbra."

[[bin]]
name = "antumbra-mcp"
path = "src/main.rs"

[dependencies]
# `testing` gives the byte-histogram FixedEmbedder so the server compiles and
# runs without a GPU; the real BERT embedder lands under `models`.
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
antumbra-store = { path = "../antumbra-store" }
antumbra-sync = { path = "../antumbra-sync" }
antumbra-serve = { path = "../antumbra-serve", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "signal", "net", "sync"] }
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
chrono.workspace = true
serde = { workspace = true }
serde_json.workspace = true
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
# Networked transport (ADR-0015): the JWT-authenticated, per-request multi-tenant
# HTTP surface. axum hosts the streamable-HTTP service; jsonwebtoken verifies the
# bearer token whose claims become $auth (tenant, user).
axum = "0.8"
jsonwebtoken = "10"
# Outbound HTTP for the runtime-configured embeddings endpoint (P-1c). Pure-Rust
# TLS so it needs no system OpenSSL; `json` for send_json/read_json.
ureq = { version = "3", features = ["json"] }
# The `Embedder` port (and the `HttpEmbedder` impl + the answer-escalate test fake)
# are `#[async_trait]`.
async-trait.workspace = true

[dev-dependencies]
# `oneshot` to drive the axum router in tests without binding a socket.
tower = { version = "0.5", features = ["util"] }
# Read the SSE response body incrementally in the live-notification round-trip test.
futures = "0.3"

[features]
default = []
# Swap the byte-histogram embedder for the real candle BERT embedder (needs the
# model weights). Same dimension (EMBED_DIM) either way.
models = ["dep:antumbra-serve", "antumbra-serve/models"]
# GPU backend for the embedder + the `answer` tool's MultiAdapterServe (so the
# networked server can actually serve through experts on a CUDA box).
cuda = ["models", "antumbra-serve/cuda"]
metal = ["models", "antumbra-serve/metal"]
