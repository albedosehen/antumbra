[package]
name = "antumbra-core"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Antumbra domain core: typed entities, lifecycle state machines, and the port traits that seam off serving and training."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
chrono.workspace = true
# Content addresses of verifiers.
sha2 = "0.11"
# A behavior's check: the patterns an answer must and must not
# match. fancy-regex rather than regex, for the lookarounds the trainer's
# Python checks accept.
fancy-regex = "0.17"

[features]
# Exposes in-memory fakes of the ports so downstream crates can drive the
# loop/gate/boundary in tests without a GPU, a model, or a database.
testing = []

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
