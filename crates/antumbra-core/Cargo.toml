[package]
name = "antumbra-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Antumbra domain core: typed entities, lifecycle state machines, and the port traits that seam off serving and training."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
chrono.workspace = true
# Content addresses of verifiers (ADR-0022 S-4).
sha2 = "0.11"

[features]
# Exposes in-memory fakes of the ports so downstream crates can drive the
# loop/gate/boundary in tests without a GPU, a model, or a database.
testing = []

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
