[package]
name = "antumbra-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Antumbra operator CLI: migrate, inspect the population, and drive the generational loop."

[[bin]]
name = "antumbra"
path = "src/main.rs"

[dependencies]
# `testing` feature: the CLI drives the loop with the demo (fake) trainer +
# embedder until the real candle/llama engines (antumbra-train/serve) land.
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
antumbra-store = { path = "../antumbra-store" }
antumbra-sync = { path = "../antumbra-sync" }
antumbra-loop = { path = "../antumbra-loop" }
antumbra-gate = { path = "../antumbra-gate" }
antumbra-boundary = { path = "../antumbra-boundary" }
antumbra-train = { path = "../antumbra-train", optional = true }
antumbra-critic = { path = "../antumbra-critic", optional = true }
antumbra-serve = { path = "../antumbra-serve", optional = true }
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true
# Live harness ingestion (R-5): a small blocking HTTP client to pull traces from
# a running Kushtaka harness. Gated with `models` (metabolize is a models command)
# so the default CLI stays HTTP-free. Already in the tree via hf-hub.
ureq = { version = "3", optional = true }

[features]
default = []
# Enables the `train` command: the real candle Qwen2.5-Coder + LoRA trainer
# wired into the loop. Needs a GPU + model weights to actually run. Keeping
# antumbra-train optional keeps candle out of the default CLI build.
models = [
    "dep:antumbra-train",
    "antumbra-train/models",
    "dep:antumbra-critic",
    "dep:antumbra-serve",
    "antumbra-serve/models",
    "dep:ureq",
]
# GPU backends (combine with `models`): e.g. --features models,cuda.
cuda = ["antumbra-train/cuda"]
metal = ["antumbra-train/metal"]
