[package]
name = "antumbra-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Antumbra operator CLI: migrate, inspect the population, and drive the generational loop."

[package.metadata.wix]
upgrade-guid = "A8B84FC9-DC1A-44D5-8F5A-E186A9688F14"
path-guid = "CE7819F8-F651-4B74-92C6-997CB8AAE2AB"
license = false
eula = false

[[bin]]
name = "antumbra"
path = "src/main.rs"

[dependencies]
# `testing` feature: the CLI drives the loop with the demo (fake) trainer +
# embedder until the real candle/llama engines (antumbra-train/serve) land.
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
antumbra-store = { path = "../antumbra-store" }
# The per-workspace embedder (set-embedder / reembed) builds an HttpEmbedder
# from a workspace's configured endpoint; light (ureq), no models needed.
antumbra-embed = { path = "../antumbra-embed" }
antumbra-copal = { path = "../antumbra-copal" }
antumbra-ingest = { path = "../antumbra-ingest" }
antumbra-sync = { path = "../antumbra-sync" }
antumbra-loop = { path = "../antumbra-loop" }
antumbra-gate = { path = "../antumbra-gate" }
antumbra-boundary = { path = "../antumbra-boundary" }
antumbra-train = { path = "../antumbra-train", optional = true }
antumbra-critic = { path = "../antumbra-critic", optional = true }
antumbra-serve = { path = "../antumbra-serve", optional = true }
clap = { workspace = true, features = ["env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true
# `antumbra claude remember` writes through the MCP surface's REST shim, as the
# hooks do: a blocking `ureq` POST run off the async runtime, as elsewhere.
ureq = { version = "3", features = ["json"] }

[features]
default = []
# Enables the `train` command: the real candle Qwen2.5-Coder + LoRA trainer
# wired into the loop. Needs a GPU + model weights to actually run. Keeping
# antumbra-train optional keeps candle out of the default CLI build.
models = [
    "dep:antumbra-train",
    "antumbra-train/models",
    "dep:antumbra-critic",
    "dep:antumbra-serve",
    "antumbra-serve/models",
]
# GPU backends. Each implies `models` (the cfg that gates the candle trainer into
# `teach`/`train`), so `--features cuda` alone is enough -- matching antumbra-train /
# antumbra-serve, whose `cuda`/`metal` likewise pull in `models`.
cuda = ["models", "antumbra-train/cuda"]
metal = ["models", "antumbra-train/metal"]
