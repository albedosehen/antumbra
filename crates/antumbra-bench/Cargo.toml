[package]
name = "antumbra-bench"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Antumbra multi-domain retrieval-quality benchmark: compares embedder configs (the FixedEmbedder baseline and, opt-in via env, a real Matryoshka HTTP endpoint) over a small labeled corpus spanning code, finance, and news/insider domains, reporting recall@k + MRR."

[[bin]]
name = "antumbra-bench"
path = "src/main.rs"

# Not a release artifact. `dist` packages every workspace binary by default and
# then demands WiX GUIDs for the MSI installer, which is how a benchmark
# harness came to fail the release plan. The three binaries that DO ship
# (antumbra-cli, antumbra-mcp, antumbra-tui, the same three `just install`
# installs) carry their GUIDs; this one opts out instead of inventing some.
[package.metadata.dist]
dist = false

[dependencies]
# `testing` lights up FixedEmbedder, the deterministic baseline that lets the
# bench run (and be tested) with no network.
antumbra-core = { path = "../antumbra-core", features = ["testing"] }
antumbra-store = { path = "../antumbra-store" }
# The HttpEmbedder Matryoshka path is structurally supported (env-gated); light
# (ureq), no models needed.
antumbra-embed = { path = "../antumbra-embed" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
